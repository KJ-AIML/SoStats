version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sostats_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sostats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sostats_secret}
      POSTGRES_DB: ${POSTGRES_DB:-sostats_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: sostats_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: sostats_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_password}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    container_name: sostats_minio_init
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000
      ${MINIO_ROOT_USER:-admin}
      ${MINIO_ROOT_PASSWORD:-minio_secret_password}; do
        echo 'waiting for minio';
        sleep 2;
      done;
      mc mb --ignore-existing local/${MINIO_BUCKET:-sostats-uploads};
      mc anonymous set none local/${MINIO_BUCKET:-sostats-uploads};
      echo 'minio bucket ready';
      "

  mailpit:
    image: axllent/mailpit
    container_name: sostats_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres_data:
  redis_data:
  minio_data:
